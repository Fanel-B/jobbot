name: Tests, oracles, types et build

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verification:
    name: Tests, oracles, types et build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run collector tests (Python, no database)
        run: python3 -m unittest discover -s tools -v

      - name: Verify scoring oracle
        run: npm run verifier-scoring

      - name: Verify eligibility oracle
        run: npm run verifier-eligibility

      - name: Check types
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
